  <style>:root{
  /* VK palette */
  --brand:#0077ff;--action:#0070f0;--action-hover:#0063d6;--action-active:#0058bf;
  --icon:#0077ff;--link:#0062cc;
  --ground:#f2f3f5;--soft:#f5f5f5;--surface:#fff;
  --ink:#202020;--muted:#757575;--line:#e7e8ec;
  --secondary:#e4f1ff;--secondary-hover:#d3e8ff;--secondary-active:#c2dfff;
  --selected:#e4f1ff;--hover:rgba(0,0,0,.04);--press:rgba(0,0,0,.07);
  --green:#267a2d;--green-bg:#e8f5e9;--red:#b42318;--red-bg:#fff4f3;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --ease:cubic-bezier(.2,0,0,1);
  --font-display:"VK Sans Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-family:"VK Sans Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;font-synthesis:none}

*{box-sizing:border-box}
body{margin:0;background:var(--ground)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{border:0;background:none;color:inherit}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
input,textarea,select{min-width:0}
button,section,article,div,main{min-width:0}
a{color:var(--link)}
h1,h2,h3,p{margin:0}
h1{font-size:24px;line-height:1.25;font-weight:700}
h2{font-size:20px;line-height:1.3;font-weight:650}
h3{font-size:17px;line-height:1.35;font-weight:600}
small,.meta{font-size:14px;color:var(--muted)}
.icon{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--ground)}
.skip{position:fixed;top:-100px;left:12px;padding:12px;background:var(--surface);z-index:100}
.skip:focus{top:8px}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.top-inner{max-width:1200px;margin:auto;height:100%;display:flex;align-items:center;gap:24px;padding:0 20px}
.brand{display:flex;align-items:center;padding:0;gap:7px;min-width:178px}
.brand span{font-size:23px;font-weight:750;letter-spacing:-.7px}
.brand img{display:block}
.global-search{height:36px;width:238px;background:var(--ground);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted)}
.global-search .icon{width:19px;height:19px}
.global-search input{min-height:28px;border:0;outline:0;background:transparent;width:100%;font-size:14px;color:var(--ink)}
.global-search kbd{font-size:19px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:16px;margin-left:auto}
.demo-tag{border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:14px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--secondary);color:var(--link);font-weight:650}
.notification{position:relative}
.notification span{position:absolute;right:7px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.app-layout{display:grid;grid-template-columns:160px minmax(0,1fr);gap:24px;max-width:1200px;padding:20px;margin:0 auto}
.sidebar{align-self:start;position:sticky;top:84px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 8px;width:100%;text-align:left;font-size:15px;border-radius:8px;margin-bottom:2px}
.nav-item .icon{color:var(--icon)}
.nav-item:hover,.nav-item.active{background:var(--secondary)}
.nav-item.active{font-weight:600}
.nav-rule{border:0;border-top:1px solid var(--line);margin:14px 8px}
.nav-caption{font-size:14px;color:var(--muted);padding:5px 8px}
.nav-store{display:flex;align-items:center;gap:10px;padding:9px 8px;text-align:left;width:100%;border-radius:8px;font-size:14px}
.nav-store:hover{background:var(--secondary)}
.nav-foot{font-size:13px;color:var(--muted);padding:18px 8px;line-height:1.8}
.text-link{min-height:26px;padding:0;color:var(--link);text-align:left;font-size:inherit}
.page-grid{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:16px;align-items:start}
.feed-column{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.community{grid-column:1/-1}
.cover{height:188px;background:#7e7064;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 41%;filter:brightness(.6)}
.cover-word{position:absolute;left:34px;bottom:22px;color:var(--surface);font-size:48px;letter-spacing:3px;font-weight:600}
.cover-note{position:absolute;right:25px;bottom:28px;color:var(--surface);font-size:14px;max-width:140px;line-height:1.4;text-align:right}
.community-info{padding:22px 24px 0}
.community-row{display:flex;align-items:center;gap:16px}
.store-avatar{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#7e7064;color:#fff;font-family:Georgia,serif;font-size:44px;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.store-avatar.small{width:42px;height:42px;font-size:30px}
.store-avatar.tiny{width:28px;height:28px;font-size:22px}
.community-title{flex:1}
.community-title h1{display:flex;gap:8px;align-items:center;font-size:23px}
.verified{color:var(--brand);width:18px;height:18px}
.community-title p{font-size:14px;color:var(--muted);margin-top:6px}
.community-actions{display:flex;gap:8px;align-items:center}
.btn{background:var(--action);color:var(--surface);font-size:15px;font-weight:600;min-height:38px;padding:8px 18px;border-radius:8px;display:inline-flex;justify-content:center;align-items:center;gap:8px;white-space:normal;line-height:1.3;transition:background .15s}
.btn:hover{background:#0064d8}
.btn.secondary{background:var(--secondary);color:var(--link)}
.btn.secondary:hover{background:var(--line)}
.btn.quiet{background:transparent;color:var(--link)}
.btn.wide{width:100%}
.btn.large{min-height:46px;font-size:16px}
.btn .icon{width:20px;height:20px}
.community-tabs{display:flex;gap:22px;margin-top:22px;border-top:1px solid var(--line)}
.tab{padding:15px 0 12px;font-size:15px;position:relative;color:var(--muted);font-weight:600;min-height:48px}
.tab.selected{color:var(--ink)}
.tab.selected:after{content:"";position:absolute;height:3px;bottom:0;background:var(--brand);left:0;right:0;border-radius:4px}
.tab-count{font-size:14px;color:var(--muted);margin-left:6px;font-weight:400}
.section-head{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-head h2{font-size:18px}
.section-head h2 span{color:var(--muted);font-size:15px;font-weight:400;margin-left:5px}
.section-head .text-link{font-size:14px}
.product-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 20px 20px}
.product-mini{text-align:left;padding:0;display:flex;flex-direction:column}
.product-mini img{aspect-ratio:1/1;width:100%;object-fit:cover;border-radius:8px;background:var(--ground);transition:filter .15s}
.product-mini:hover img{filter:brightness(.96)}
.product-mini strong{font-size:16px;margin-top:10px}
.product-mini span{font-size:14px;margin-top:2px;line-height:1.35}
.product-mini small{font-size:13px;margin-top:4px}
.post{padding-top:20px}
.post-author{display:flex;align-items:center;gap:10px;padding:0 20px}
.post-author-info{flex:1}
.post-author strong{font-size:15px;font-weight:600;color:var(--link)}
.post-author p{font-size:13px;color:var(--muted);margin-top:2px}
.post-text{padding:16px 20px;font-size:16px;line-height:1.55}
.post-text p+p{margin-top:9px}
.post-media{position:relative;display:block;padding:0;width:100%;background:#f3f3f3}
.post-media img{width:100%;height:320px;object-fit:cover;object-position:50% 67%;display:block}
.product-pin{position:absolute;bottom:16px;left:18px;background:var(--surface);border-radius:8px;display:flex;align-items:center;gap:9px;padding:9px 12px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:14px}
.product-pin .icon{color:var(--brand);width:20px;height:20px}
.buy-row{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.buy-row-info{flex:1}
.buy-row-info strong{font-size:18px;display:block}
.buy-row-info span{font-size:14px;color:var(--muted)}
.buy-row .btn{min-width:120px}
.post-social{display:flex;align-items:center;gap:14px;padding:10px 14px}
.social-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;border-radius:8px;min-height:36px;padding:5px 8px}
.social-btn:hover{background:var(--ground)}
.social-btn.liked{color:var(--red)}
.views{font-size:13px;color:var(--muted);margin-left:auto;padding-right:6px}
.rail{display:flex;flex-direction:column;gap:16px}
.rail .card{padding:18px 20px}
.rail h2{font-size:17px;margin-bottom:16px}
.rail-info{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;font-size:14px}
.rail-info:last-child{margin-bottom:0}
.rail-info .icon{color:var(--icon);width:20px;height:20px;margin-top:1px}
.rail-info p{color:var(--muted);font-size:13px;margin-top:3px}
.review-stars{color:var(--green);font-size:18px;letter-spacing:1px}
.rating-row{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.rating-row strong{font-size:20px}
.rating-row small{font-size:13px}
.review-copy{font-size:14px;line-height:1.5}
.review-person{font-size:13px;color:var(--muted);margin-top:12px}
.member-row{display:flex;margin-top:14px;gap:5px}
.member{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--secondary);color:var(--link);font-size:13px}
.rail-demo{padding:0 8px;font-size:13px;color:var(--muted);line-height:1.6}
.rail-demo button{margin-top:4px}
.chat-float{position:fixed;bottom:24px;right:26px;width:56px;height:56px;border-radius:50%;background:var(--action);color:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:12}
.chat-float:hover{background:#0064d8}
.catalog-header{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}
.catalog-tools{padding:16px 24px;display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--line);border-radius:8px;min-height:36px;padding:6px 14px;font-size:14px}
.filter.active{background:var(--secondary);color:var(--link);border-color:var(--secondary)}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px;padding:8px 24px 24px}
.catalog-product{display:flex;flex-direction:column}
.catalog-product>button{padding:0;text-align:left}
.catalog-product img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
.catalog-product h3{font-size:16px;margin-top:10px}
.catalog-product .meta{margin-top:5px;font-size:14px}
.catalog-product strong{font-size:18px;margin:10px 0}
.catalog-product>.btn{margin-top:auto}
.no-results{padding:35px 24px;text-align:center;color:var(--muted);grid-column:1/-1}
.page-heading{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.page-heading .icon{color:var(--icon)}
.orders-list{padding:0 24px 24px}
.empty-state{text-align:center;padding:48px 24px}
.empty-icon{width:64px;height:64px;background:var(--secondary);color:var(--icon);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px}
.empty-icon .icon{width:32px;height:32px}
.empty-state p{color:var(--muted);max-width:320px;margin:10px auto 22px}
.order-card{border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:18px}
.order-line{display:flex;align-items:center;gap:14px}
.order-line img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.order-line .grow{flex:1}
.order-line p{font-size:14px;color:var(--muted);margin-top:3px}
.order-topline{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:16px;gap:12px}
.status{color:var(--green);background:#edf7ed;border-radius:4px;padding:4px 8px;font-size:13px}
.order-actions{margin-top:16px;display:flex;gap:8px}
.chat-layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:650px}
.chat-list{border-right:1px solid var(--line);background:var(--surface);padding:16px 8px}
.chat-list h2{font-size:18px;padding:4px 10px 20px}
.chat-preview{background:var(--secondary);display:flex;gap:9px;padding:12px 10px;border-radius:8px;width:100%;text-align:left}
.chat-preview strong{font-size:15px}
.chat-preview p{font-size:13px;color:var(--muted);margin-top:5px}
.chat-note{font-size:13px;color:var(--muted);padding:18px 12px}
.conversation{display:flex;flex-direction:column;min-width:0}
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-header .grow{flex:1}
.chat-header h2{font-size:16px}
.chat-header p{font-size:13px;color:var(--muted);margin-top:2px}
.chat-body{padding:18px;flex:1;background:var(--surface);min-height:440px;max-height:65vh;overflow-y:auto}
.chat-date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.message{font-size:15px;max-width:85%;border-radius:12px;padding:11px 14px;background:var(--ground);margin-bottom:12px;width:fit-content;overflow-wrap:anywhere}
.message.outgoing{margin-left:auto;background:var(--secondary)}
.message-time{display:block;font-size:12px;color:var(--muted);text-align:right;margin-top:5px}
.invoice{background:var(--surface);border:1px solid var(--line);padding:0;overflow:hidden;width:280px;max-width:100%;margin-bottom:16px;border-radius:12px}
.invoice-image{height:130px;width:100%;object-fit:cover;object-position:50% 70%;display:block}
.invoice-content{padding:14px}
.invoice-content .meta{font-size:13px;margin-bottom:8px}
.invoice-content h3{font-size:16px}
.invoice-content strong{display:block;font-size:20px;margin:10px 0}
.invoice-content p{font-size:14px;color:var(--muted);margin:6px 0 12px}
.chat-compose{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px;background:var(--surface)}
.chat-compose input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px;background:var(--ground)}
.chat-compose .icon-btn{color:var(--icon)}
.mobile-nav{display:none}
dialog{padding:0;border:0;border-radius:16px;max-height:92dvh;width:min(760px,calc(100% - 32px));max-width:760px;background:var(--surface);color:var(--ink);box-shadow:0 16px 64px rgba(0,0,0,.24);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);gap:12px}
.modal-head h2{font-size:20px}
.modal-body{padding:24px}
.modal-head .grow{flex:1}
.modal-head .icon-btn{margin:-8px -8px -8px 0}
.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.detail-image{width:100%;aspect-ratio:1/1.15;object-fit:cover;border-radius:8px;object-position:40% 65%}
.detail-copy .meta{font-size:14px}
.detail-copy h3{font-size:22px;margin:8px 0}
.detail-price{font-size:26px;font-weight:700;margin:12px 0 4px}
.in-stock{color:var(--green);font-size:14px;display:flex;align-items:center;gap:5px}
.in-stock .icon{width:17px;height:17px}
.option-label{font-size:14px;color:var(--muted);margin:20px 0 10px}
.variants{display:flex;gap:8px}
.variant{min-width:70px;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;transition:transform .5s cubic-bezier(.34,1.56,.64,1),border-color .3s}
.variant[aria-pressed="true"]{border-color:var(--brand);color:var(--link);background:var(--selected);transform:scale(1.04)}
.quantity{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;max-width:140px;margin:8px 0 20px}
.quantity button{width:40px;height:38px;color:var(--link);display:grid;place-items:center}
.quantity .icon{width:18px;height:18px}
.quantity output{font-size:15px}
.detail-actions{display:flex;flex-direction:column;gap:8px}
.detail-description{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.55}
.detail-description strong{color:var(--ink)}
.modal-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-foot .grow{flex:1}
.modal-foot .meta{font-size:13px;display:flex;align-items:center;gap:6px}
.modal-foot .meta .icon{width:16px;height:16px}
.checkout-steps{display:flex;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
.checkout-steps .current{color:var(--link);font-weight:600}
.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px}
.checkout-main h3{font-size:17px;margin-bottom:14px}
.delivery-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.choice{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;position:relative;display:flex;align-items:center;gap:8px;font-size:14px;min-height:68px}
.choice[aria-pressed="true"]{background:var(--selected);border-color:var(--brand)}
.choice .icon{color:var(--icon);width:22px;height:22px}
.choice span{display:block}
.choice small{font-size:13px;display:block;margin-top:4px}
.choice .radio-mark{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);margin-left:auto;flex-shrink:0;background:var(--surface)}
.choice[aria-pressed="true"] .radio-mark{border:5px solid var(--action)}
.field{display:block;font-size:14px;color:var(--muted);margin-bottom:14px}
.field input,.field select{display:block;border:1px solid var(--line);background:var(--ground);border-radius:8px;min-height:42px;width:100%;padding:9px 12px;color:var(--ink);margin-top:6px;font-size:15px}

/* ===== VK refresh: surfaces, type, states (overrides the base rules above) ===== */

/* Type */
h1,h2,h3,.brand span,.cover-word{font-family:var(--font-display);letter-spacing:-.01em}
h2{font-weight:600}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.detail-price,.total-line,.checkout-total-block strong,.cart-total,.cart-row strong,.buy-row-info strong,.product-mini strong,.catalog-product strong,.invoice-content strong,.order-line strong,.summary-item-price,.counter,.quantity output{font-variant-numeric:tabular-nums}

/* Surfaces: clean white cards on light gray, hairline edge instead of a border */
.card{border:0;border-radius:var(--r-lg);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.community-tabs,.buy-row,.catalog-header,.modal-head,.modal-foot,.chat-header,.chat-compose,.chat-list,.cart-row,.summary-items,.total-line.total{border-color:var(--line)}
.product-mini img,.catalog-product img,.detail-image,.cart-row img,.summary-product img,.order-line img,.invoice-image,.post-media img{outline:1px solid rgba(0,0,0,.06);outline-offset:-1px}
.product-mini img,.catalog-product img,.detail-image,.cart-row img,.order-line img{border-radius:var(--r-md)}
.summary-product img{border-radius:10px}

/* Focus */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Buttons: hover, active, disabled */
.btn{border-radius:var(--r-md);background:var(--action);transition-property:background-color,color,scale,opacity;transition-duration:.15s;transition-timing-function:var(--ease)}
.btn:hover{background:var(--action-hover)}
.btn:active{background:var(--action-active);scale:.96;filter:none}
.btn.secondary{background:var(--secondary);color:var(--link)}
.btn.secondary:hover{background:var(--secondary-hover)}
.btn.secondary:active{background:var(--secondary-active)}
.btn.quiet{background:transparent}
.btn.quiet:hover{background:var(--hover)}
.btn.quiet:active{background:var(--press)}
.btn:disabled,.btn:disabled:hover,.btn:disabled:active{opacity:.48;scale:1;cursor:not-allowed;background:var(--action)}
.btn.secondary:disabled,.btn.secondary:disabled:hover{background:var(--secondary)}
button:disabled{cursor:not-allowed}
.icon-btn{border-radius:10px;color:var(--muted);transition:background-color .15s var(--ease)}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active,.nav-item:active{background:var(--press)}
.text-link{color:var(--link);font-weight:500;border-radius:4px}
.text-link:hover{text-decoration:underline;text-underline-offset:3px}
.social-btn{transition:background-color .15s var(--ease),color .15s var(--ease)}
.social-btn:hover{background:var(--hover);color:var(--ink)}
.social-btn:active{background:var(--press)}
.social-btn.liked{color:#e64646}

/* Counter badge (counts only) */
.counter{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;line-height:1;margin-left:auto}
.btn .counter{margin-left:2px}

/* Top bar and navigation */
.topbar{border-bottom-color:var(--line)}
.global-search{background:var(--ground);border-radius:10px}
.global-search:focus-within{background:var(--surface);box-shadow:0 0 0 1px var(--brand)}
.demo-tag{border-color:var(--line);border-radius:var(--r-sm);transition:background-color .15s var(--ease)}
.demo-tag:hover{background:var(--hover)}
.user-avatar{background:var(--secondary);color:var(--link)}
.nav-item{border-radius:10px;color:var(--ink);transition:background-color .15s var(--ease)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.nav-item .icon{color:var(--icon)}
.nav-store{border-radius:10px}
.nav-store:hover{background:var(--hover)}
.nav-rule{border-top-color:var(--line)}

/* Community header */
.tab{transition:color .15s var(--ease)}
.tab:hover{color:var(--ink)}
.tab.selected:after{height:2px;border-radius:2px}

/* Post and product pin */
.post-author strong{color:var(--ink)}
.product-pin{border-radius:var(--r-md);box-shadow:0 1px 4px rgba(0,0,0,.12);padding:8px 10px 8px 12px;gap:8px}
.product-pin strong{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.post-media:hover .product-pin{background:var(--soft)}
.product-mini,.catalog-product>button{border-radius:var(--r-md)}
.product-mini small,.in-stock{color:var(--green)}

/* Filters */
.filter{border-color:var(--line);border-radius:var(--r-sm);transition:background-color .15s var(--ease)}
.filter:hover{background:var(--hover)}
.filter.active{background:var(--secondary);color:var(--link);border-color:transparent;font-weight:500}

/* Status token */
.status{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;font-weight:500;white-space:nowrap}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.order-card{border:1px solid var(--line);border-radius:var(--r-lg)}
.empty-icon{background:var(--selected);color:var(--brand)}

/* Chat */
.chat-preview{background:var(--selected);border-radius:var(--r-md)}
.chat-date{font-weight:500}
.message{background:var(--ground);border-radius:18px 18px 18px 6px;line-height:1.4}
.message.outgoing{background:var(--selected);border-radius:18px 18px 6px 18px}
.invoice{border:1px solid var(--line);border-radius:var(--r-lg)}
.chat-compose input{background:var(--ground);border:1px solid transparent;border-radius:20px;padding:8px 16px}
.chat-compose input:focus{background:var(--surface);border-color:var(--brand);outline:none}
.chat-compose .icon-btn{color:var(--brand)}

/* Dialog */
dialog{border-radius:var(--r-lg);box-shadow:0 8px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(0,0,0,.4)}

/* Product options */
.variant{border-radius:var(--r-md);border-color:var(--line);background:var(--surface);font-weight:500}
.variant:hover{background:var(--hover)}
.variant[aria-pressed="true"]{background:var(--selected);border-color:var(--brand);color:var(--link);box-shadow:inset 0 0 0 1px var(--brand)}
.quantity{border:0;background:var(--ground);border-radius:var(--r-md)}
.quantity button{border-radius:var(--r-md);transition:background-color .15s var(--ease)}
.quantity button:not(:disabled):hover{background:rgba(0,0,0,.05)}
.quantity button:not(:disabled):active{background:rgba(0,0,0,.09)}
.quantity button:disabled{opacity:.35}
.quantity output{font-weight:600}
.cart-row .remove{border-radius:4px}
.cart-row .remove:hover{color:var(--red)}

/* Checkout steps */
.checkout-steps{list-style:none;padding:0;margin:8px 0 0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.checkout-steps li{display:flex;align-items:center;gap:6px}
.checkout-steps li+li:before{content:"";width:24px;height:1px;background:var(--line);margin-right:2px}
.checkout-steps .current{color:var(--ink);font-weight:600}
.checkout-steps .done{color:var(--link)}
.step-num{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ground);color:var(--muted);font-size:12px;font-weight:600}
.step-num .icon{width:14px;height:14px}
.current .step-num{background:var(--brand);color:#fff}
.done .step-num{background:var(--selected);color:var(--brand)}

/* Choices: delivery and payment */
.choice{border-color:var(--line);border-radius:var(--r-md);background:var(--surface);transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.choice:hover{background:var(--soft)}
.choice:active{background:var(--ground)}
.choice[aria-pressed="true"]{background:var(--selected);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.choice .icon{color:var(--brand)}
.choice span{font-weight:500}
.choice small{font-weight:400;color:var(--muted)}
.choice:disabled{opacity:.6}
.choice .radio-mark{border:1.5px solid #b8c1cc}
.choice[aria-pressed="true"] .radio-mark{border:6px solid var(--brand)}
.payment-logo{border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:700;font-size:13px}
.payment-logo.sbp{color:#5b57a2}
.payment-logo.card{color:#0f754e}
.payment-logo.sber{color:#21a038}
.payment-disclaimer{background:var(--soft);border-radius:var(--r-md)}
.delivery-note{background:var(--selected);color:var(--ink);border-radius:var(--r-md)}
.delivery-note .icon{color:var(--brand)}

/* Fields */
.field{color:var(--muted);font-weight:500}
.field input,.field select{background-color:var(--ground);border:1px solid transparent;border-radius:10px;min-height:44px;font-weight:400;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.field input:hover,.field select:hover{border-color:var(--line)}
.field input:focus,.field select:focus{background-color:var(--surface);border-color:var(--brand);outline:none}
.field input[aria-invalid="true"]{border-color:var(--red);background-color:var(--red-bg)}
.field-error{font-weight:400}
.error{background:var(--red-bg);border-radius:var(--r-md);padding:10px 12px}
.saved-info .icon{color:var(--brand)}

/* Summary and deal protection */
.checkout-summary{background:var(--soft);border-radius:var(--r-lg)}
.protect{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r-md);padding:12px;margin-top:16px}
.protect .icon{color:var(--brand);width:20px;height:20px;margin-top:1px}
.protect strong{display:block;font-size:14px}
.protect p{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.summary-note{margin-top:12px}

/* Success */
.success-check{background:var(--green-bg);color:var(--green)}
.success-summary{background:var(--soft);border-radius:var(--r-lg)}
.success-summary .total-line>span:last-child{text-align:right}

/* Order tracking */
.track-list li:not(:last-child):before{left:11px;width:2px;background:var(--line)}
.track-list li.done:not(:last-child):before{background:var(--brand)}
.track-dot{border-color:var(--line);background:var(--surface)}
.track-list .done .track-dot{background:var(--brand);border-color:var(--brand)}
.track-list .current{color:var(--ink)}
.track-list .current .track-dot{border-color:var(--brand);display:grid;place-items:center}
.track-list .current .track-dot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}

/* Floating chat, toast */
.chat-float{background:var(--action);box-shadow:0 4px 12px rgba(0,119,255,.28);transition:background-color .15s var(--ease),scale .15s var(--ease)}
.chat-float:hover{background:var(--action-hover)}
.chat-float:active{scale:.96}
.toast{background:var(--ink);border-radius:var(--r-md)}

/* Mobile: bottom sheet dialogs, VK mobile nav */
@media(max-width:700px){
.mobile-nav{border-top-color:var(--line)}
.mobile-item{border-radius:10px;font-weight:500}
.mobile-item.active{color:var(--brand)}
.mobile-item:active{background:var(--press)}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom)}
#modal-content:has(#checkout-form){max-height:94dvh}
.checkout-steps li+li:before{width:16px}
.protect{margin-top:12px}
}

/* Cart footer: full-width total row (was collapsed to "Товары3 870 ₽") */
.cart-footer{align-items:stretch}
.cart-total>span:first-child{font-weight:500;color:var(--muted);font-size:16px;align-self:center}
</style>
</head>

const readStore=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
let state={view:'feed',filter:'Все товары',query:'',product:'milk',size:350,qty:1,liked:false,following:false,checkout:null,cart:readStore('vk-demo-cart-v1',[]),orders:readStore('vk-demo-orders-v1',[]),messages:[]};
state.cart=(Array.isArray(state.cart)?state.cart:[]).filter(x=>products.some(p=>p.id===x.id)&&[250,350].includes(x.size)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=8);
state.orders=Array.isArray(state.orders)?state.orders.filter(o=>o&&Array.isArray(o.items)&&o.items.every(x=>products.some(p=>p.id===x.id))):[];
const persist=()=>{try{localStorage.setItem('vk-demo-cart-v1',JSON.stringify(state.cart));localStorage.setItem('vk-demo-orders-v1',JSON.stringify(state.orders))}catch{}};
const productBy=id=>products.find(p=>p.id===id)||products[0];
const itemPrice=i=>productBy(i.id).price-(i.size===250?200:0);
const subtotal=items=>items.reduce((sum,i)=>sum+itemPrice(i)*i.qty,0);
const count=()=>state.cart.reduce((sum,i)=>sum+i.qty,0);

}

bel="Отправить демо-сообщение">${icon('send')}</button></form></div></section>`}
function render(){renderNav();$('#content').innerHTML=state.view==='catalog'?renderCatalog():state.view==='chat'?renderChat():state.view==='orders'?renderOrders():renderFeed();document.title=(state.view==='chat'?'Сообщения':state.view==='catalog'?'Товары':state.view==='orders'?'Мои заказы':'Керамика «Кружок»')+': прототип VK';}
function view(v){state.view=v;render();window.scrollTo({top:0,behavior:'instant'});}
const modal=$('#modal');let lastFocus;
function openModal(html){if(!modal.open)lastFocus=document.activeElement;$('#modal-content').innerHTML=html;if(!modal.open)modal.showModal();modal.scrollTop=0;$('#modal-title')?.focus({preventScroll:true});}
function closeModal(){modal.close();if(lastFocus?.isConnected)lastFocus.focus();}
const head=(title,sub='')=>`<div class="modal-head"><div class="grow"><h2 id="modal-title" tabindex="-1">${title}</h2>${sub}</div><button class="icon-btn" data-action="close" aria-label="Закрыть окно">${icon('cancel')}</button></div>`;
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function showProduct(id,reset=true){if(reset){state.product=id;state.size=350;state.qty=1}const p=productBy(state.product),item={id:p.id,size:state.size,qty:state.qty};openModal(`${head('Товар сообщества')}<div class="modal-body product-detail"><img class="detail-image" src="${p.image}" alt="${p.name}"><div class="detail-copy"><p class="meta">Керамика «Кружок»</p><h3>${p.name}</h3><div class="detail-price" aria-live="polite">${money(itemPrice(item))}</div><p class="in-stock">${icon('done')}В наличии ${p.stock} шт.</p><p class="option-label">Объём</p><div class="variants" aria-label="Объём кружки">${[250,350].map(size=>`<button class="variant" data-action="size" data-size="${size}" aria-pressed="${state.size===size}">${size} мл</button>`).join('')}</div><p class="option-label">Количество</p><div class="quantity"><button data-action="qty" data-delta="-1" aria-label="Уменьшить количество" ${state.qty===1?'disabled':''}>${icon('minus_outline')}</button><output aria-live="polite">${state.qty}</output><button data-action="qty" data-delta="1" aria-label="Увеличить количество" ${state.qty>=p.stock?'disabled':''}>${icon('add')}</button></div><div class="detail-actions"><button class="btn large" data-action="detail-buy">Купить за ${money(itemPrice(item)*state.qty)}</button><button class="btn secondary large" data-action="add-cart">В корзину</button></div><p class="detail-description">${p.description}<br><br><strong>Доставка и самовывоз</strong><br>СДЭК, Яндекс Доставка или бесплатно из мастерской.</p></div></div>`)}
function updateProduct(){
 const p=productBy(state.product),i={id:p.id,size:state.size,qty:state.qty};
 $('.detail-price').textContent=money(itemPrice(i));
 $('.detail-actions [data-action="detail-buy"]').textContent='Купить за '+money(itemPrice(i)*state.qty);
 document.querySelectorAll('.variant').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.size)===state.size));
 $('.quantity output').textContent=state.qty;
 $('.quantity [data-delta="-1"]').disabled=state.qty===1;
 $('.quantity [data-delta="1"]').disabled=state.qty>=p.stock;
 if(document.activeElement?.disabled)$('.quantity button:not(:disabled)')?.focus();
}
function addCart(){const existing=state.cart.find(x=>x.id===state.product&&x.size===state.size);if(existing)existing.qty=Math.min(productBy(state.product).stock,existing.qty+state.qty);else state.cart.push({id:state.product,size:state.size,qty:state.qty});persist();renderNav();closeModal();toast('Товар добавлен в корзину')}
function showCart(){openModal(`${head('Корзина')}<div class="modal-body">${state.cart.length?state.cart.map((i,index)=>`<div class="cart-row"><img src="${productBy(i.id).image}" alt="${productBy(i.id).name}"><div class="grow"><h3>${productBy(i.id).name}</h3><p>${i.size} мл</p><div class="quantity"><button data-action="cart-qty" data-index="${index}" data-delta="-1" ${i.qty===1?'disabled':''} aria-label="Уменьшить количество">${icon('minus_outline')}</button><output>${i.qty}</output><button data-action="cart-qty" data-index="${index}" data-delta="1" ${i.qty>=productBy(i.id).stock?'disabled':''} aria-label="Увеличить количество">${icon('add')}</button></div><button class="remove" data-action="remove-cart" data-index="${index}">Удалить</button></div><strong>${money(itemPrice(i)*i.qty)}</strong></div>`).join(''):`<div class="empty-state"><div class="empty-icon">${icon('shopping_cart_outline')}</div><h3>Корзина пока пуста</h3><p>Добавьте понравившуюся кружку из каталога.</p><button class="btn" data-action="cart-catalog">Открыть товары</button></div>`}</div>${state.cart.length?`<div class="modal-foot cart-footer"><div class="cart-total"><span>Товары</span><span>${money(subtotal(state.cart))}</span></div><button class="btn large wide" data-action="cart-checkout">Перейти к оформлению</button></div>`:''}`)}
function startCheckout(items,source){state.checkout={items:items.map(x=>({...x})),source,step:1,delivery:'cdek',payment:'sbp',name:'Денис',phone:'+7 900 000-00-00',address:'Москва, ул. Примерная, 12',point:'Москва, ул. Примерная, 12',provider:'СДЭК',error:'',errors:{},busy:false};checkout()}
function deliveryPrice(c){return c.delivery==='pickup'?0:c.delivery==='courier'?390:190}
function summary(c){return `<aside class="checkout-summary"><h3 class="summary-heading">Ваш заказ</h3><div class="summary-items">${c.items.map(i=>{const p=productBy(i.id);return `<div class="summary-product"><img src="${p.image}" alt="${p.name}"><div><strong>${p.name}</strong><p>${i.size} мл, ${i.qty} шт.</p><span class="summary-item-price">${money(itemPrice(i)*i.qty)}</span></div></div>`}).join('')}</div><div class="total-line"><span>Товары</span><span>${money(subtotal(c.items))}</span></div><div class="total-line"><span>Доставка</span><span>${deliveryPrice(c)?money(deliveryPrice(c)):'Бесплатно'}</span></div><div class="total-line total"><span>Итого</span><span>${money(subtotal(c.items)+deliveryPrice(c))}</span></div><div class="protect">${icon('lock_outline')}<div><strong>Защита сделки (концепция)</strong><p>В предлагаемой схеме мастерская получает оплату после получения заказа.</p></div></div><p class="summary-note">Детали заказа останутся в переписке с мастерской.</p></aside>`}
function checkoutField(c,key,label,attributes=''){const error=c.errors?.[key];return `<label class="field" for="checkout-${key}">${label}<input id="checkout-${key}" name="${key}" value="${esc(c[key])}" autocomplete="off" ${attributes} required aria-invalid="${!!error}"${error?` aria-describedby="error-${key}"`:''}>${error?`<span class="field-error" id="error-${key}">${esc(error)}</span>`:''}</label>`}
function checkout(){const c=state.checkout;if(!c)return;const steps=`<ol class="checkout-steps" aria-label="Шаги оформления"><li class="${c.step===1?'current':'done'}" ${c.step===1?'aria-current="step"':''}><span class="step-num" aria-hidden="true">${c.step===1?'1':icon('done')}</span>Получение</li><li class="${c.step===2?'current':''}" ${c.step===2?'aria-current="step"':''}><span class="step-num" aria-hidden="true">2</span>Оплата</li></ol>`;
 let main=c.step===1?`<h3>Как получить заказ</h3><div class="delivery-options">${[['cdek','cube_box_outline','Пункт выдачи','190 ₽, 2-4 дня'],['courier','truck_outline','Курьер','390 ₽, 1-2 дня'],['pickup','place_outline','Самовывоз','Бесплатно, завтра']].map(([id,ico,title,sub])=>`<button class="choice" data-action="delivery" data-delivery="${id}" aria-pressed="${c.delivery===id}">${icon(ico)}<span>${title}<small>${sub}</small></span></button>`).join('')}</div>${c.delivery==='pickup'?`<div class="delivery-note">${icon('place_outline')}<div>Мастерская «Кружок»<br>Москва, ул. Примерная, 12<br><span class="meta">Ежедневно с 11:00 до 20:00, демо-адрес</span></div></div>`:c.delivery==='cdek'?`<label class="field">Служба доставки<select name="provider"><option ${c.provider==='СДЭК'?'selected':''}>СДЭК</option><option ${c.provider==='Яндекс Доставка'?'selected':''}>Яндекс Доставка</option></select></label><label class="field">Пункт выдачи<select name="point"><option ${c.point==='Москва, ул. Примерная, 12'?'selected':''}>Москва, ул. Примерная, 12</option><option ${c.point==='Москва, ул. Учебная, 7'?'selected':''}>Москва, ул. Учебная, 7</option></select></label>`:`${checkoutField(c,'address','Адрес доставки','maxlength="120"')}<p class="meta" style="margin-bottom:16px">Яндекс Доставка, демо-адрес</p>`}<h3 style="margin-top:22px">Получатель</h3>${checkoutField(c,'name','Имя','maxlength="60"')}${checkoutField(c,'phone','Телефон','type="tel" inputmode="tel" maxlength="25"')}<p class="saved-info">${icon('user_outline')}Данные из демо-профиля VK ID, можно оставить как есть</p>`:`<h3>Способ оплаты</h3><div class="payment-choices">${[['sbp','СБП','Система быстрых платежей','Оплата через приложение банка'],['card','МИР','Банковская карта','Демонстрационная карта •• 2026'],['sber','Сбер','SberPay','Оплата в приложении СберБанк']].map(([id,logo,title,sub])=>`<button class="choice" data-action="payment" data-payment="${id}" aria-pressed="${c.payment===id}"><span class="payment-logo ${id}">${logo}</span><span>${title}<small>${sub}</small></span><span class="radio-mark" aria-hidden="true"></span></button>`).join('')}</div><div class="payment-disclaimer">Это тестовая оплата. Деньги не спишутся, вводить данные карты не нужно.</div><h3 style="margin-top:24px">Получение</h3><p style="font-size:15px">${c.delivery==='pickup'?'Самовывоз из мастерской':c.delivery==='courier'?'Яндекс Доставка, курьер':esc(c.provider)+', пункт выдачи'}</p><p class="meta" style="margin-top:6px">${esc(c.delivery==='courier'?c.address:c.delivery==='pickup'?'Москва, ул. Примерная, 12':c.point)}</p><p class="meta" style="margin-top:8px">${esc(c.name)}, ${esc(c.phone)}</p><button class="text-link" style="font-size:14px;margin-top:12px" data-action="checkout-back">Изменить</button>`;
 openModal(`${head(c.step===1?'Оформление заказа':'Оплата заказа',steps)}<form id="checkout-form" novalidate><div class="modal-body checkout-grid"><div class="checkout-main">${c.error?`<p class="error" role="alert">${esc(c.error)}</p>`:''}${main}</div>${summary(c)}</div><div class="modal-foot checkout-footer"><div class="checkout-total-block"><span>Итого с доставкой</span><strong aria-live="polite">${money(subtotal(c.items)+deliveryPrice(c))}</strong></div><button class="btn large" type="submit">${c.step===1?'Перейти к оплате':'Оплатить '+money(subtotal(c.items)+deliveryPrice(c))}</button><span class="meta checkout-demo-note">${icon('lock_outline')}Тестовая покупка, деньги не спишутся</span></div></form>`)
}
function collectCheckout(){const f=$('#checkout-form');if(!f||state.checkout.step!==1)return;const d=new FormData(f);for(const key of ['name','phone','address','point','provider'])if(d.has(key))state.checkout[key]=String(d.get(key)).trim()}
function submitCheckout(){
 const c=state.checkout;
 if(c.busy)return;
 if(c.step===1){
  collectCheckout();c.errors={};
  if(c.name.length<2)c.errors.name='Введите имя, хотя бы 2 буквы.';
  const digits=c.phone.replace(/\D/g,'');
  if(digits.length<10||digits.length>11)c.errors.phone='Введите телефон из 10 или 11 цифр.';
  if(c.delivery==='courier'&&c.address.length<8)c.errors.address='Укажите улицу и номер дома.';
  if(Object.keys(c.errors).length){c.error='Проверьте отмеченные поля.';checkout();const invalid=$('#checkout-'+Object.keys(c.errors)[0]);invalid?.focus({preventScroll:true});invalid?.closest('.field').scrollIntoView({block:'center',behavior:'instant'});return}
  c.error='';c.step=2;checkout();return;
 }
 c.busy=true;const button=$('#checkout-form button[type="submit"]');button.disabled=true;button.textContent='Подтверждаем оплату…';
 document.querySelectorAll('#checkout-form [data-action="payment"]').forEach(b=>b.disabled=true);
 setTimeout(()=>{const id=String(Date.now()),number=String(10420+state.orders.length+1),o={id,number,items:c.items.map(i=>({...i})),total:subtotal(c.items)+deliveryPrice(c),delivery:c.delivery,provider:c.provider,payment:c.payment,created:new Date().toISOString()};state.orders.push(o);if(c.source==='cart')state.cart=[];persist();render();showSuccess(o);},650)
}
function showSuccess(o){openModal(`${head('Заказ оформлен')}<div class="success-body"><div class="success-check">${icon('done')}</div><h3>Готово! Заказ у мастерской</h3><p>Заказ № ${esc(o.number)} оплачен в демо-режиме. Все детали и статусы доступны в переписке.</p><div class="success-summary"><div class="total-line"><span>Продавец</span><strong>Керамика «Кружок»</strong></div><div class="total-line"><span>Получение</span><span>${o.delivery==='pickup'?'Самовывоз':o.delivery==='courier'?'Курьер':'Пункт выдачи'}</span></div><div class="total-line"><span>Защита сделки</span><span>До получения (демо)</span></div><div class="total-line total"><span>Оплачено (демо)</span><span>${money(o.total)}</span></div></div><div class="success-actions"><button class="btn large" data-action="success-chat">Перейти в переписку</button><button class="btn secondary large" data-action="track" data-id="${esc(o.id)}">Статус заказа</button></div><div class="success-small">Деньги не списывались. Реальный заказ не отправлен.</div></div>`)}
function showTrack(id){const o=state.orders.find(x=>x.id===id);if(!o)return;openModal(`${head('Заказ № '+esc(o.number))}<div class="modal-body"><div class="order-line"><img src="${productBy(o.items[0].id).image}" alt="${productBy(o.items[0].id).name}"><div class="grow"><h3>Керамика «Кружок»</h3><p>${o.items.reduce((s,i)=>s+i.qty,0)} шт. на ${money(o.total)}</p></div><span class="status">Оплачен</span></div><ol class="track-list"><li class="done"><span class="track-dot">${icon('done')}</span><div><strong>Оплачено</strong><p>Демонстрация удержания оплаты до получения заказа</p></div></li><li class="done"><span class="track-dot">${icon('done')}</span><div><strong>Собран</strong><p>Мастерская упаковала заказ</p></div></li><li class="current" aria-current="step"><span class="track-dot"></span><div><strong>${o.delivery==='pickup'?'Готов к выдаче':'В пути'}</strong><p>${o.delivery==='pickup'?'В течение 1 дня':o.delivery==='courier'?'Яндекс Доставка, 1-2 дня':esc(o.provider)+', 2-4 дня'}</p></div></li><li><span class="track-dot"></span><div><strong>Получен</strong><p>В концепции после получения оплата поступает мастерской</p></div></li></ol><p class="meta">Показаны примеры статусов и сроков. Доставка не вызывается.</p></div><div class="modal-foot"><button class="btn wide" data-action="success-chat">Написать мастерской</button></div>`)}
function showAbout(){openModal(`${head('О прототипе')}<div class="modal-body about-body"><p>Прототип команды для VK Case Champ 2026: от интереса к товару в ленте до оплаченного заказа внутри сообщества.</p><h3>Что можно попробовать</h3><ul><li>Купить кружку из поста или каталога.</li><li>Выбрать объём, количество и собрать корзину.</li><li>Оформить счёт из переписки с мастерской.</li><li>Выбрать доставку, пройти тестовую оплату и посмотреть статус заказа.</li></ul><h3>Демонстрационные данные</h3><p>«Кружок»: вымышленный магазин. Товары, цены, отзывы, остатки, адреса и сроки используются только для показа сценария. Партнёрства с доставкой и платёжными сервисами не подключены. Сообщения видны только вам, деньги не списываются. Корзина и демо-заказы сохраняются в этом браузере. Контактные данные не сохраняются и никуда не отправляются.</p><h3>Дизайн и фотографии</h3><p>Интерфейс основан на <a href="https://vkui.io/overview/about/" target="_blank" rel="noopener">VKUI</a>, <a href="https://corp.vkcdn.ru/media/files/211021_vk_brand_guidelines_master_v2_1.pdf" target="_blank" rel="noopener">брендбуке VK</a> и <a href="https://github.com/VKCOM/icons" target="_blank" rel="noopener">VK Icons</a>. Это концепция команды, а не действующий сервис VK.</p><p>Фотографии: <a href="https://unsplash.com/photos/1514228742587-6b1558fcca3d" target="_blank" rel="noopener">Unsplash</a>, <a href="https://hoppeshoppe.com/products/nude-ceramic-mug" target="_blank" rel="noopener">Hoppe Shoppe</a>, <a href="https://bartoncroft.com/products/mug-in-milk" target="_blank" rel="noopener">Barton Croft</a>.</p><button class="btn secondary" data-action="reset-demo">Сбросить мои демо-заказы и корзину</button></div>`)}
function showReviews(){openModal(`${head('Отзывы покупателей')}<div class="modal-body about-body"><p>Примеры отзывов для демонстрации интерфейса.</p><div class="rating-row"><strong>4,9</strong><span class="meta">из 5</span><span class="meta">48 отзывов, демо</span></div>${[['Анна','Теперь это моя любимая кружка. Очень приятная на ощупь, а приехала в целости!'],['Михаил','Брал в подарок. Хорошо упаковали, всё понравилось.'],['Катя','Забрала из мастерской. Вживую глазурь ещё красивее.']].map(([name,text])=>`<div style="padding:16px 0;border-top:1px solid var(--line)"><h3>${name}</h3><p style="margin:8px 0 0">${text}</p></div>`).join('')}</div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const a=b.dataset.action;
 if(a==='view'){view(b.dataset.view)}
 else if(a==='close')closeModal();
 else if(a==='product')showProduct(b.dataset.id);
 else if(a==='buy')startCheckout([{id:b.dataset.id,size:350,qty:1}],'post');
 else if(a==='detail-buy')startCheckout([{id:state.product,size:state.size,qty:state.qty}],'product');
 else if(a==='chat-buy')startCheckout([{id:'milk',size:350,qty:1}],'chat');
 else if(a==='size'){state.size=Number(b.dataset.size);updateProduct()}
 else if(a==='qty'){state.qty=Math.max(1,Math.min(productBy(state.product).stock,state.qty+Number(b.dataset.delta)));updateProduct()}
 else if(a==='add-cart')addCart();
 else if(a==='cart')showCart();
 else if(a==='cart-catalog'){closeModal();view('catalog')}
 else if(a==='cart-qty'){const i=state.cart[Number(b.dataset.index)];i.qty=Math.max(1,Math.min(productBy(i.id).stock,i.qty+Number(b.dataset.delta)));persist();renderNav();showCart()}
 else if(a==='remove-cart'){state.cart.splice(Number(b.dataset.index),1);persist();renderNav();showCart()}
 else if(a==='cart-checkout')startCheckout(state.cart,'cart');
 else if(a==='delivery'){collectCheckout();state.checkout.delivery=b.dataset.delivery;checkout();document.querySelector('[data-delivery="'+b.dataset.delivery+'"]')?.focus()}
 else if(a==='payment'){state.checkout.payment=b.dataset.payment;checkout();document.querySelector('[data-payment="'+b.dataset.payment+'"]')?.focus()}
 else if(a==='checkout-back'){state.checkout.step=1;checkout()}
 else if(a==='success-chat'){closeModal();view('chat')}
 else if(a==='track')showTrack(b.dataset.id);
 else if(a==='repeat'){const o=state.orders.find(x=>x.id===b.dataset.id);if(o)startCheckout(o.items,'repeat')}
 else if(a==='filter'){state.filter=b.dataset.filter;render()}
 else if(a==='clear-search'){state.query='';$('#search').value='';render()}
 else if(a==='follow'){state.following=!state.following;render();toast(state.following?'Вы подписались на сообщество':'Подписка отменена')}
 else if(a==='like'){state.liked=!state.liked;render()}
 else if(a==='save')toast('Запись сохранена в этом прототипе');
 else if(a==='share'){try{await navigator.clipboard.writeText(location.href);toast('Ссылка на прототип скопирована')}catch{toast('Скопируйте ссылку из адресной строки')}}
 else if(a==='comments')openModal(`${head('Комментарии')}<div class="modal-body about-body"><p>Анна: «А можно забрать из мастерской?»</p><p>Кружок: «Да! Выберите самовывоз при оформлении.»</p><button class="btn secondary" data-action="success-chat">Задать вопрос в сообщениях</button></div>`);
 else if(a==='reviews')showReviews();
 else if(a==='about')showAbout();
 else if(a==='reset-demo'){state.cart=[];state.orders=[];state.messages=[];persist();closeModal();render();toast('Демо-заказы и корзина сброшены')}
});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();state.query=$('#search').value.trim();view('catalog')}else if(e.target.id==='checkout-form'){e.preventDefault();submitCheckout()}else if(e.target.id==='chat-form'){e.preventDefault();const input=e.target.elements.message,text=input.value.trim();if(!text)return;state.messages.push({out:true,text});input.value='';render();setTimeout(()=>{state.messages.push({out:false,text:'Спасибо! Это демо-переписка. Для покупки откройте счёт выше или выберите товар в каталоге.'});render();$('#chat-body')?.scrollTo(0,$('#chat-body').scrollHeight)},450)}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
modal.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()});
render();
</script>
</body>
</html>
